<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sample: Mock interview question</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,700;1,9..144,500&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  /* page and text */
  --page:#FFF8F0;--card:#FFFFFF;--ink:#2A2347;--text:#4A4363;--text-soft:#6E6687;--line:#EFE4F7;--line-strong:#D9CBE8;
  --plum:#7556A8;--es:#6A4FA3;
  /* actions */
  --indigo1:#5F57C9;--indigo:#3F3A9E;--indigo-lip:#2E2A78;
  --liberty1:#17907D;--liberty:#127567;--liberty-lip:#0C5348;--liberty-soft:#DDF4EF;--liberty-text:#127567;
  --red1:#DA4558;--red:#C22F43;--red-lip:#8F1F30;--red-soft:#FBE6E9;--red-text:#C22F43;
  --gold1:#FFD66B;--gold:#F5B026;--gold-ink:#4A2A00;--on-accent:#FFFFFF;
  --glass:rgba(255,255,255,.26);--shadow:92,52,120;
  /* the Mall at golden hour */
  --s1:#2B3596;--s2:#5B55C2;--s3:#A873C6;--s4:#F08F8C;--s5:#FFC489;--s6:#FFE6AE;
  --sun:#FFF7DC;--sun-o:1;--glow:#FFD98A;--star-o:.5;--cloud-a:#E7D3F7;--cloud-b:#FFBFA3;
  --far:#B985B8;--land1:#674A92;--land2:#4E3777;--rim:#FFC39A;--win:#FFD98A;
  --tree1:#44356E;--tree2:#5D4A8C;--lawn:#9A78B0;--lawn2:#F6D9D2;--pool1:#FFDCA6;--pool2:#F8D2CF;--flag:#F0607A;--bird:#3B2D63;
  /* type, shape, space */
  --serif:Fraunces,Georgia,serif;--sans:Nunito,system-ui,sans-serif;
  --fs-question:27px;--fs-es:18px;--fs-body:17px;--fs-button:15px;--fs-small:13px;--fs-micro:12px;
  --r-card:28px;--r:18px;--r-sm:14px;--r-pill:999px;
  --sp-1:4px;--sp-2:8px;--sp-3:12px;--sp-4:16px;--sp-5:20px;--sp-6:24px;
  --ease:cubic-bezier(0.22,1,0.36,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --page:#12152B;--card:#1C2040;--ink:#F1EEFA;--text:#D5D0E6;--text-soft:#A9A2C4;--line:#2F3360;--line-strong:#444A82;
  --plum:#BBA5E8;--es:#C7B4F2;
  --indigo1:#8E87F0;--indigo:#6C64DB;--indigo-lip:#4640A0;
  --liberty1:#4DD1BA;--liberty:#2FB39C;--liberty-lip:#1D7F6F;--liberty-soft:#173A3A;--liberty-text:#4DD1BA;
  --red1:#F58C9A;--red:#E96A7B;--red-lip:#B04555;--red-soft:#3A1E2A;--red-text:#F58C9A;
  --on-accent:#0D1424;--glass:rgba(255,255,255,.14);--shadow:0,0,10;
  --s1:#060920;--s2:#0F153F;--s3:#26235C;--s4:#4B2F6E;--s5:#7A4476;--s6:#B5607A;
  --sun-o:0;--glow:#C56C84;--star-o:1;--cloud-a:#3A3A78;--cloud-b:#7A4A80;
  --far:#2A2A5E;--land1:#DAD4F2;--land2:#A9A0D2;--rim:#FFFFFF;
  --tree1:#0E1230;--tree2:#1B2150;--lawn:#1F2350;--lawn2:#12152B;--pool1:#4A3F80;--pool2:#1A1D3E;--flag:#F27B8B;--bird:transparent;}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page)}
body{color:var(--text);font:600 var(--fs-body)/24px var(--sans);-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer}
.app{position:relative;max-width:560px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.scene{position:absolute;inset:0 0 auto 0;z-index:0}
.scene svg{display:block;width:100%;height:auto;aspect-ratio:390/300}
.content{position:relative;z-index:1;display:flex;flex-direction:column;flex:1;padding:var(--sp-4);padding-bottom:max(var(--sp-4),env(safe-area-inset-bottom))}

/* top bar, on the sky */
.top{display:flex;align-items:center;gap:var(--sp-3);height:44px}
.x{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:var(--glass);color:#fff;display:grid;place-items:center;flex:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.bar{position:relative;flex:1;height:14px;border-radius:var(--r-pill);background:var(--glass);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.bar i{display:block;height:100%;width:var(--p);border-radius:inherit;background:linear-gradient(90deg,var(--gold1),var(--gold));position:relative;box-shadow:0 0 12px rgba(255,214,107,.7);transition:width .4s var(--ease)}
.bar i::after{content:"";position:absolute;left:6px;right:6px;top:3px;height:3px;border-radius:var(--r-pill);background:rgba(255,255,255,.55)}
.tally{display:flex;gap:6px;flex:none}
.tally b{font-size:var(--fs-small);font-weight:900;height:30px;padding:0 10px;border-radius:var(--r-pill);display:flex;align-items:center;gap:4px;color:#fff;background:var(--glass);border:1px solid rgba(255,255,255,.35);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* question card */
.card{position:relative;margin-top:calc(46.2vw - 4px);padding:var(--sp-4) var(--sp-5);border-radius:var(--r-card);
  background:linear-gradient(var(--card),var(--card)) padding-box,linear-gradient(160deg,rgba(255,255,255,.95),var(--line)) border-box;border:1.5px solid transparent;
  box-shadow:0 22px 44px -16px rgba(var(--shadow),.38),0 4px 12px rgba(var(--shadow),.10)}
@media (min-width:560px){.card{margin-top:254px}}
.chips{display:flex;gap:var(--sp-2);flex-wrap:wrap}
.chip{height:28px;padding:0 12px;border-radius:var(--r-pill);font-size:var(--fs-small);font-weight:800;display:inline-flex;align-items:center;gap:6px;background:var(--page);color:var(--text);border:1.5px solid var(--line)}
.chip.star{background:linear-gradient(180deg,var(--gold1),var(--gold));color:var(--gold-ink);border-color:transparent;box-shadow:0 2px 0 #C98A12}
.officer{display:flex;align-items:center;gap:10px;margin:var(--sp-4) 0 var(--sp-3)}
.who{flex:1}
.badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(180deg,var(--indigo1),var(--indigo));box-shadow:0 2px 0 var(--indigo-lip)}
.who{font-size:var(--fs-micro);line-height:16px;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--plum)}
.q{margin:0;font:700 var(--fs-question)/33px var(--serif);letter-spacing:-.3px;color:var(--ink)}
.speak{position:relative;width:48px;height:48px;border-radius:50%;border:0;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(180deg,var(--indigo1),var(--indigo));box-shadow:0 4px 0 var(--indigo-lip),0 12px 20px -6px rgba(63,58,158,.55),inset 0 1px 0 rgba(255,255,255,.35)}
.speak::before,.speak::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--indigo1);opacity:0;animation:ring 2.4s var(--ease) infinite}
.speak::after{animation-delay:1.2s}
@keyframes ring{0%{transform:scale(.9);opacity:.5}100%{transform:scale(1.35);opacity:0}}
.orn{display:flex;align-items:center;gap:10px;margin-top:var(--sp-3);color:var(--gold)}
.orn::before,.orn::after{content:"";flex:1;height:1px}
.orn::before{background:linear-gradient(90deg,transparent,var(--line-strong))}.orn::after{background:linear-gradient(90deg,var(--line-strong),transparent)}
.es-toggle{display:inline-flex;align-items:center;gap:6px;margin-top:var(--sp-2);height:28px;padding:0 12px;border-radius:var(--r-pill);border:1.5px solid var(--line);background:var(--page);color:var(--plum);font:900 var(--fs-micro)/16px var(--sans);letter-spacing:1.2px;text-transform:uppercase}
.es{margin:var(--sp-2) 0 0;font:italic 500 var(--fs-es)/25px var(--serif);color:var(--es)}

/* answer */
.field{position:relative;margin-top:14px}
.field input{width:100%;height:58px;border-radius:var(--r);border:2px solid var(--line);background:var(--card);padding:0 66px 0 18px;font:700 var(--fs-body) var(--sans);color:var(--ink);box-shadow:0 10px 22px -16px rgba(var(--shadow),.55),inset 0 2px 4px rgba(var(--shadow),.05);transition:border-color .2s,box-shadow .2s}
.field input::placeholder{color:var(--text-soft);opacity:1}
.field input:focus{outline:none;border-color:var(--indigo1);box-shadow:0 0 0 4px rgba(95,87,201,.18)}
.mic{position:absolute;right:7px;top:7px;width:44px;height:44px;border:0;border-radius:var(--r-sm);display:grid;place-items:center;color:var(--on-accent);background:linear-gradient(180deg,var(--liberty1),var(--liberty));box-shadow:0 3px 0 var(--liberty-lip),inset 0 1px 0 rgba(255,255,255,.3)}

/* the road to 12 */
.road{margin-top:var(--sp-3);padding:10px 14px 9px;border-radius:var(--r);background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0)),var(--page);border:1.5px dashed var(--line-strong)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .road{background:transparent}}
.road .stars{display:flex;justify-content:space-between}
.st{width:20px;height:20px;fill:none;stroke:var(--line-strong);stroke-width:1.8;stroke-linejoin:round}
.st.on{fill:var(--gold);stroke:#D8930F;filter:drop-shadow(0 2px 3px rgba(245,176,38,.45))}
.road p{margin:6px 0 0;display:flex;justify-content:space-between;font-size:var(--fs-small);line-height:18px;font-weight:800;color:var(--text-soft)}
.road p b{color:var(--ink);font-weight:900}

.spacer{flex:1;min-height:var(--sp-3)}
.btn{display:block;width:100%;height:56px;border:0;border-radius:var(--r);font:900 var(--fs-button)/20px var(--sans);letter-spacing:1px;text-transform:uppercase;transition:transform 80ms,box-shadow 80ms}
.btn.primary{color:var(--on-accent);background:linear-gradient(180deg,var(--liberty1),var(--liberty));box-shadow:0 5px 0 var(--liberty-lip),0 16px 24px -12px rgba(18,117,103,.75),inset 0 1px 0 rgba(255,255,255,.35)}
.btn.danger{color:var(--on-accent);background:linear-gradient(180deg,var(--red1),var(--red));box-shadow:0 5px 0 var(--red-lip),0 16px 24px -12px rgba(194,47,67,.7),inset 0 1px 0 rgba(255,255,255,.3)}
.btn.ghost{height:52px;margin-top:var(--sp-3);background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn:active,.btn.is-pressed{transform:translateY(5px);box-shadow:none}

/* feedback sheet */
.sheet{position:fixed;z-index:5;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;padding:var(--sp-5) var(--sp-4) max(var(--sp-5),env(safe-area-inset-bottom));border-radius:var(--r-card) var(--r-card) 0 0;box-shadow:0 -12px 30px -18px rgba(var(--shadow),.5);animation:up 260ms var(--ease) backwards}
@keyframes up{from{translate:0 40px;opacity:0}}
.sheet.wrong{background:var(--red-soft)}.sheet.right{background:var(--liberty-soft)}
.sheet h2{margin:0 0 6px;font:700 22px/28px var(--serif);display:flex;gap:10px;align-items:center}
.sheet h2 i{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font:900 15px var(--sans);color:var(--on-accent)}
.sheet.wrong h2{color:var(--red-text)}.sheet.wrong h2 i{background:var(--red)}
.sheet.right h2{color:var(--liberty-text)}.sheet.right h2 i{background:var(--liberty)}
.sheet p{margin:0;color:var(--ink);font-weight:700}
.sheet ul{margin:2px 0 0;padding-left:20px;color:var(--ink);font-weight:800}
.sheet small{display:block;color:var(--text);font-size:var(--fs-small);line-height:18px;margin:6px 0 var(--sp-4);font-weight:700}

/* scene motion */
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{50%{opacity:.25}}
.dr{animation:dr 38s ease-in-out infinite alternate}.dr2{animation:dr 52s ease-in-out infinite alternate-reverse}
@keyframes dr{to{translate:14px 0}}
.rp{animation:rp 3s ease-in-out infinite}
@keyframes rp{50%{opacity:.2}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <div class="scene">%%SCENE%%</div>
  <div class="content">
    <div class="top">
      <button class="x" aria-label="Leave the interview"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      <div class="bar" role="progressbar" aria-label="Question 9 of 20" aria-valuenow="9" aria-valuemax="20" style="--p:45%"><i></i></div>
      <div class="tally" aria-label="7 right, 1 wrong"><b>✓ 7</b><b>✕ 1</b></div>
    </div>

    <section class="card">
      <div class="chips"><span class="chip">Mock interview · 9 of 20</span><span class="chip star">★ 65/20 list</span></div>
      <div class="officer">
        <span class="badge"><svg width="20" height="20" viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7 33h26M10 33V23h20v10M15 23v10M20 23v10M25 23v10M11 23c0-6 4-10 9-10s9 4 9 10M20 13V7"/></svg></span>
        <span class="who">The officer asks</span>
        <button class="speak" aria-label="Hear the question"><svg width="22" height="22" viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z" fill="currentColor"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
      </div>
      <p class="q">What is the supreme law of the land?</p>
      <div class="orn" aria-hidden="true">✦</div>
      <button class="es-toggle" aria-expanded="true">Español <span aria-hidden="true">▴</span></button>
      <p class="es" lang="es">¿Cuál es la ley suprema de la nación?</p>
    </section>

    <div class="field">
      <input id="answer" type="text" placeholder="Say or type your answer" aria-label="Your answer">
      <button class="mic" aria-label="Answer out loud"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21"/></svg></button>
    </div>

    <div class="road" aria-label="7 of 12 right answers needed to pass, 1 of 9 misses">
      <div class="stars">%%STARS%%</div>
      <p><span><b>7 of 12</b> right to pass</span><span><b>1 of 9</b> misses</span></p>
    </div>

    <div class="spacer"></div>
    <div id="actions">
      <button class="btn primary">Check</button>
      <button class="btn ghost">I don't know</button>
    </div>
  </div>
</main>
<script>
// Preview states for screenshots: ?state=ask | right | wrong
const st=new URLSearchParams(location.search).get('state')||'ask';
const a=document.getElementById('actions'),inp=document.getElementById('answer');
if(st==='right'){inp.value='The Constitution';a.className='sheet right';a.innerHTML='<h2><i>✓</i>Right!</h2><p>Accepted: (U.S.) Constitution</p><small>Words in parentheses are optional.</small><button class="btn primary">Next question</button>';}
if(st==='wrong'){inp.value='The Bill of Rights';a.className='sheet wrong';a.innerHTML='<h2><i>✕</i>Not this time</h2><p>The officer will accept:</p><ul><li>(U.S.) Constitution</li></ul><small>The Bill of Rights is part of it: the first ten amendments.</small><button class="btn danger">Got it</button>';}
document.querySelectorAll('.btn').forEach(b=>b.addEventListener('pointerdown',()=>{b.classList.add('is-pressed');setTimeout(()=>b.classList.remove('is-pressed'),260)}));
</script>
</body>
</html>
